<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body, iframe {
      margin: 0; padding: 0; border: 0;
      width: 100%; height: 100%;
    }
  </style>
</head>
<body>
  <iframe id="frame" allow="camera *; microphone *;" style="width:100%; height:100%; border:none;"></iframe>
  <script>
    const frame = document.getElementById('frame');
    frame.src = "https://awsomeavatar.readyplayer.me/avatar?frameApi";

    window.addEventListener('message', handleMessage);
    function handleMessage(event) {
      const data = parse(event);
      if (!data || data.source !== 'readyplayerme') return;

      if (data.eventName === 'v1.frame.ready') {
        frame.contentWindow.postMessage(JSON.stringify({
          target: 'readyplayerme',
          type: 'subscribe',
          eventName: 'v1.**'
        }), '*');
      }

      if (data.eventName === 'v1.avatar.exported') {
        AvatarCreated.postMessage(JSON.stringify(data));
        frame.hidden = true;
      }
    }

    function parse(event) {
      try { return JSON.parse(event.data); } catch (_) { return null; }
    }
  </script>
</body>
</html>
