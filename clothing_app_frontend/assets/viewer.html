<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://preview.babylonjs.com/viewer/babylon.viewer.js"></script>
</head>
<body style="margin:0">
  <babylon id="babylon-viewer"
    camera.behaviors.auto-rotate="0"
    templates.main.params.fill-screen="true"
    templates.nav-bar.html="<div/>"
    templates.loading-screen.params.background-color="#fff">
  </babylon>
  <script>
    window.loadViewer = function(url) {
      BabylonViewer.viewerManager.getViewerPromiseById('babylon-viewer').then(viewer => {
        viewer.loadModel({ url });
      });
    };
  </script>
</body>
</html>
